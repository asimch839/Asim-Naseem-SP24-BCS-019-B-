name: weather_app
description: "A professional production-ready Flutter Weather App."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.10.8 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  dio: ^5.4.1
  geolocator: ^11.0.0
  geocoding: ^3.0.0
  shared_preferences: ^2.2.2
  lottie: ^3.1.0
  flutter_screenutil: ^5.9.0
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.0.0
  intl: ^0.19.0
  flutter_spinkit: ^5.2.0
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.66.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/lottie/
